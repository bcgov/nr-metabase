name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  # PR open and close use the same group, allowing only one at a time
  group: pr-${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check Triggers
    if: (!github.event.pull_request.head.repo.fork)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.triggered }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: diff
        uses: bcgov/actions/diff-triggers@122a9b1c6c082b1b1f18c300020fbdc417b6b0b2 # v0.10.0
        with:
          triggers: |
            .
            !*.md

  extract_version:
    name: Extract Version
    if: (!github.event.pull_request.head.repo.fork)
    runs-on: ubuntu-24.04
    outputs:
      app_version: ${{ steps.read_yaml.outputs.app_version }}
      available: ${{ steps.read_yaml.outputs.available }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Extract Version
        id: read_yaml
        shell: bash
        run: |
          appVersion="$(bash .github/scripts/get-metabase-version.sh)"
          echo "app version is $appVersion"
          echo "app_version=$appVersion" >> "$GITHUB_OUTPUT"
          echo "available=$([ -n "$appVersion" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Get App Version
        run: echo "${{ steps.read_yaml.outputs.app_version }}"

  builds:
    name: Builds
    needs: [check, extract_version]
    if: (needs.check.outputs.code == 'true' && needs.extract_version.outputs.available == 'true')
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: bcgov/actions/builder@122a9b1c6c082b1b1f18c300020fbdc417b6b0b2 # v0.10.0
        with:
          package: metabase
          tags: ${{ github.sha }}
          build_args: |
            METABASE_VERSION=${{ needs.extract_version.outputs.app_version }}
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/metabase
          target: ${{ github.sha }}
          tags: |
            ${{ github.event.number }}

  deploys:
    name: Deploys
    needs: [builds]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Deploy to OpenShift
        uses: bcgov/actions-openshift/oc-runner@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        env:
          DB_HOST_PORT: ${{ secrets.DB_HOST_PORT_ENV }}
        with:
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_token: ${{ secrets.OC_TOKEN }}
          oc_server: ${{ vars.OC_SERVER }}
          commands: |
            # Clear this PR's release if an earlier run left it failed or pending,
            # since upgrade --install refuses a release with no deployed revision
            release=nr-metabase-${{ github.event.number }}
            status=$(helm status "$release" -o json 2>/dev/null | jq -r '.info.status' || true)
            if [ -n "$status" ] && [ "$status" != "deployed" ]; then
              echo "Release $release is '$status'; uninstalling before deploy"
              helm uninstall "$release" --wait --timeout 1m
            fi

            # Helm waits up to 5m for readiness; on failure --atomic rolls the
            # release back. The outer timeout adds 3m of headroom so that
            # rollback finishes and never leaves a stuck release. The 1m cleanup plus
            # one 8m attempt fit inside oc-runner's 10m limit; a second does not.
            timeout 8m helm upgrade --install --wait --atomic nr-metabase-${{ github.event.number }} \
              --set-literal metabase.dbHostPortEnv="${DB_HOST_PORT}" \
              --set-string global.secrets.databasePassword="${{ secrets.DB_PASSWORD}}" \
              --set-string global.zone="${{ github.event.number }}" \
              --set-string metabase.metabaseImage.tag="${{ github.sha }}" \
              --set-string namespace="${{ vars.oc_namespace }}" \
              --timeout 5m charts/nr-metabase --debug

  results:
    name: PR Results
    needs: [check, extract_version, builds, deploys]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: bcgov/actions/workflow-results@122a9b1c6c082b1b1f18c300020fbdc417b6b0b2 # v0.10.0
        with:
          needs: ${{ toJson(needs) }}
