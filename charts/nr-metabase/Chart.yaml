apiVersion: v2
name: nr-metabase
description: A Helm chart for Deploying MetaBase on Openshift with Oracle DB support.
# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application
# Placeholder chart/app versions; merge-main.yml overrides both via `helm package --version --app-version`
# from `metabase.metabaseImage.tag` in values.yaml.
version: 0.0.0
appVersion: "0.0.0"
dependencies:
  - name: database
    condition: database.enabled
    version: 0.1.0
  - name: backup
    condition: backup.enabled
    version: 0.1.0
keywords:
  - nr
  - metabase
  - nrm
  - nrm-metabase
  - oracle
maintainers:
  - name: Om Mishra
    email: omprakash.2.mishra@gov.bc.ca
  - name: Derek Roberts
    email: derek.roberts@gov.bc.ca
