{{/*
Database credentials Secret.

Generated once, at install time, and deliberately never mutated by an upgrade.
Two things depend on that:

  * metabase/deployment.yaml feeds databasePassword into MB_ENCRYPTION_SECRET_KEY.
    Rotating it leaves Metabase unable to decrypt values it has already written.
  * The database container only reads POSTGRES_PASSWORD when it initialises an
    empty data directory, so a rotated password stops matching the credentials
    already baked into the existing PVC.

On upgrade every key is read back from the live Secret and re-rendered
unchanged. The object is re-rendered rather than omitted on purpose: Helm prunes
resources that disappear from a release manifest, so omitting it would delete
the credentials mid-upgrade.
*/}}
{{- $secretName := printf "%s-%s" .Release.Name .Values.global.zone }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingData := dict }}
{{- if $existing }}
{{-   $existingData = $existing.data | default dict }}
{{- end }}

{{- if and .Release.IsUpgrade (not $existing) (not .Values.global.secrets.allowMissingOnUpgrade) }}
{{-   fail (printf `
Refusing to upgrade: Secret %q was not found in namespace %q.

This chart never re-creates the database credentials on upgrade. databasePassword
also backs MB_ENCRYPTION_SECRET_KEY and the Postgres data directory, so issuing a
fresh one would lock Metabase out of its own encrypted data.

  * If the Secret was deleted, restore it before retrying.
  * On a client-side dry run, lookup always returns nothing. Use --dry-run=server
    instead, or set global.secrets.allowMissingOnUpgrade=true.
` $secretName .Release.Namespace) }}
{{- end }}

{{- /* Existing value always wins, then an operator-supplied value, then a fresh random one. */}}
{{- $dbPassword := $existingData.databasePassword | default (.Values.global.secrets.databasePassword | default (randAlpha 20) | b64enc) }}
{{- $dbUser := $existingData.databaseUser | default (.Values.global.secrets.databaseUser | b64enc) }}
{{- $dbName := $existingData.databaseName | default (.Values.global.secrets.databaseName | b64enc) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels: {{- include "selectorLabels" . | nindent 4 }}
data:
  databasePassword: {{ $dbPassword | quote }}
  databaseUser: {{ $dbUser | quote }}
  databaseName: {{ $dbName | quote }}
